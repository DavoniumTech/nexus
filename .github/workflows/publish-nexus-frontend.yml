name: Publish Nexus frontend archive

on:
  push:
    branches: [main]
    paths:
      - ".nexus-upload/READY"

permissions:
  contents: write

jobs:
  unpack-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reassemble and safely unpack frontend bundle
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import pathlib
          import shutil
          import zipfile

          upload = pathlib.Path(".nexus-upload")
          parts = sorted(upload.glob("part-*.b64"))
          if len(parts) != 9:
              raise RuntimeError(f"Expected 9 archive parts; found {len(parts)}")
          encoded = "".join(part.read_text(encoding="ascii").strip() for part in parts)
          payload = base64.b64decode(encoded, validate=True)
          archive = pathlib.Path("/tmp/nexus-release.zip")
          archive.write_bytes(payload)

          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  target = (root / item.filename).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f"Unsafe archive path: {item.filename}")
              bundle.extractall(root)

          shutil.rmtree(upload)
          pathlib.Path(".github/workflows/publish-nexus-frontend.yml").unlink()
          print(f"Extracted {len(parts)} package chunks into the repository.")
          PY
      - name: Commit complete frontend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete Davonium Nexus frontend"
          git push
