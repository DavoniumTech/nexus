name: Publish Nexus frontend archive

on:
  push:
    branches: [main]
    paths:
      - ".nexus-release.zip"

permissions:
  contents: write

jobs:
  unpack-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Safely unpack frontend bundle
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          archive = pathlib.Path(".nexus-release.zip")
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  target = (root / item.filename).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f"Unsafe archive path: {item.filename}")
              bundle.extractall(root)
          archive.unlink()
          pathlib.Path(".github/workflows/publish-nexus-frontend.yml").unlink()
          print("Frontend files extracted.")
          PY
      - name: Commit complete frontend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete Davonium Nexus frontend"
          git push
