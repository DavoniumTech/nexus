name: Unpack Nexus frontend package

on:
  push:
    branches: [main]
    paths:
      - ".nexus-frontend-package.b64"

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Decode and safely extract frontend files
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import pathlib
          import zipfile

          package = pathlib.Path(".nexus-frontend-package.b64")
          archive = pathlib.Path("/tmp/nexus-frontend-package.zip")
          payload = base64.b64decode(package.read_text(encoding="ascii").strip(), validate=True)
          archive.write_bytes(payload)

          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as bundle:
              for item in bundle.infolist():
                  target = (root / item.filename).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f"Unsafe archive path: {item.filename}")
              bundle.extractall(root)

          package.unlink()
          pathlib.Path(".github/workflows/unpack-nexus-frontend.yml").unlink()
          print("Extracted all frontend archive entries.")
          PY

      - name: Commit extracted frontend files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Davonium Nexus frontend package"
          git push